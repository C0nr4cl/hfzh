<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>身份证校验码计算器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #0f1118;
–card: #181b25;
–card-border: #252a38;
–accent: #5b8def;
–accent-glow: rgba(91, 141, 239, 0.25);
–accent-soft: rgba(91, 141, 239, 0.08);
–text: #e8eaf0;
–text-dim: #7a8099;
–success: #4ecf8b;
–success-glow: rgba(78, 207, 139, 0.2);
–error: #ef6b6b;
–digit-bg: #1e2230;
–digit-border: #2d3348;
}

body {
font-family: ‘Noto Sans SC’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100dvh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
overflow: hidden;
}

/* Ambient background glow */
body::before {
content: ‘’;
position: fixed;
top: -40%; left: -20%;
width: 80vw; height: 80vw;
background: radial-gradient(circle, rgba(91,141,239,0.06) 0%, transparent 60%);
pointer-events: none;
z-index: 0;
}
body::after {
content: ‘’;
position: fixed;
bottom: -30%; right: -10%;
width: 60vw; height: 60vw;
background: radial-gradient(circle, rgba(78,207,139,0.04) 0%, transparent 60%);
pointer-events: none;
z-index: 0;
}

.container {
position: relative;
z-index: 1;
width: 100%;
max-width: 520px;
}

/* Header */
.header {
text-align: center;
margin-bottom: 36px;
}
.header .icon {
width: 56px; height: 56px;
border-radius: 16px;
background: linear-gradient(135deg, var(–accent), #7c5bef);
display: inline-flex;
align-items: center;
justify-content: center;
font-size: 24px;
margin-bottom: 16px;
box-shadow: 0 8px 32px var(–accent-glow);
}
.header h1 {
font-size: 22px;
font-weight: 700;
letter-spacing: 0.5px;
margin-bottom: 6px;
}
.header p {
font-size: 13px;
color: var(–text-dim);
font-weight: 300;
}

/* Card */
.card {
background: var(–card);
border: 1px solid var(–card-border);
border-radius: 20px;
padding: 32px 28px;
box-shadow: 0 12px 48px rgba(0,0,0,0.3);
}

.label {
font-size: 12px;
font-weight: 600;
color: var(–text-dim);
text-transform: uppercase;
letter-spacing: 1.5px;
margin-bottom: 14px;
}

/* Input area */
.input-row {
display: flex;
gap: 6px;
align-items: center;
margin-bottom: 8px;
}
.input-wrap {
flex: 1;
position: relative;
}
.input-wrap input {
width: 100%;
background: var(–digit-bg);
border: 1.5px solid var(–digit-border);
border-radius: 12px;
padding: 16px 18px;
font-family: ‘JetBrains Mono’, monospace;
font-size: 22px;
font-weight: 600;
letter-spacing: 4px;
color: var(–text);
outline: none;
transition: border-color 0.25s, box-shadow 0.25s;
caret-color: var(–accent);
}
.input-wrap input::placeholder {
color: #3a3f54;
letter-spacing: 2px;
font-weight: 400;
}
.input-wrap input:focus {
border-color: var(–accent);
box-shadow: 0 0 0 3px var(–accent-glow);
}
.input-wrap input.error {
border-color: var(–error);
box-shadow: 0 0 0 3px rgba(239,107,107,0.15);
}

.char-count {
text-align: right;
font-family: ‘JetBrains Mono’, monospace;
font-size: 12px;
color: var(–text-dim);
margin-bottom: 24px;
padding-right: 4px;
transition: color 0.2s;
}
.char-count.full { color: var(–success); }
.char-count.over { color: var(–error); }

.hint {
font-size: 12px;
color: var(–error);
min-height: 18px;
margin-bottom: 20px;
opacity: 0;
transition: opacity 0.2s;
}
.hint.show { opacity: 1; }

/* Divider */
.divider {
height: 1px;
background: linear-gradient(90deg, transparent, var(–card-border), transparent);
margin-bottom: 26px;
}

/* Result */
.result-area {
opacity: 0;
transform: translateY(12px);
transition: opacity 0.4s ease, transform 0.4s ease;
pointer-events: none;
}
.result-area.visible {
opacity: 1;
transform: translateY(0);
pointer-events: auto;
}

.result-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 14px;
margin-bottom: 20px;
}
.result-box {
background: var(–digit-bg);
border: 1px solid var(–digit-border);
border-radius: 14px;
padding: 18px 16px;
text-align: center;
}
.result-box .result-label {
font-size: 11px;
color: var(–text-dim);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 10px;
}
.result-box .check-digit {
font-family: ‘JetBrains Mono’, monospace;
font-size: 42px;
font-weight: 700;
color: var(–success);
text-shadow: 0 0 24px var(–success-glow);
line-height: 1;
}
.result-box .full-id {
font-family: ‘JetBrains Mono’, monospace;
font-size: 17px;
font-weight: 600;
color: var(–text);
letter-spacing: 2px;
word-break: break-all;
line-height: 1.5;
}
.result-box .full-id .highlight {
color: var(–success);
text-shadow: 0 0 12px var(–success-glow);
}

/* Copy button */
.copy-btn {
width: 100%;
padding: 14px;
border: 1.5px solid var(–card-border);
border-radius: 12px;
background: transparent;
color: var(–text-dim);
font-family: ‘Noto Sans SC’, sans-serif;
font-size: 13px;
font-weight: 600;
cursor: pointer;
transition: all 0.25s;
letter-spacing: 0.5px;
}
.copy-btn:hover {
border-color: var(–accent);
color: var(–accent);
background: var(–accent-soft);
}
.copy-btn:active {
transform: scale(0.98);
}
.copy-btn.copied {
border-color: var(–success);
color: var(–success);
background: rgba(78,207,139,0.08);
}

/* Clear button */
.clear-btn {
position: absolute;
right: 12px;
top: 50%;
transform: translateY(-50%);
width: 28px; height: 28px;
border-radius: 8px;
border: none;
background: rgba(255,255,255,0.06);
color: var(–text-dim);
font-size: 16px;
cursor: pointer;
display: none;
align-items: center;
justify-content: center;
transition: background 0.2s, color 0.2s;
}
.clear-btn:hover { background: rgba(239,107,107,0.15); color: var(–error); }
.clear-btn.show { display: inline-flex; }

@media (max-width: 480px) {
.card { padding: 24px 20px; }
.input-wrap input { font-size: 18px; letter-spacing: 2px; padding: 14px; }
.result-box .full-id { font-size: 14px; letter-spacing: 1px; }
.result-box .check-digit { font-size: 36px; }
}
</style>

</head>
<body>

<div class="container">
  <div class="header">
    <div class="icon">🆔</div>
    <h1>身份证校验码计算器</h1>
    <p>输入前17位数字，自动生成第18位校验码</p>
  </div>

  <div class="card">
    <div class="label">身份证前17位</div>
    <div class="input-row">
      <div class="input-wrap">
        <input
          type="text"
          id="idInput"
          inputmode="numeric"
          maxlength="17"
          placeholder="请输入17位数字"
          autocomplete="off"
        />
        <button class="clear-btn" id="clearBtn" title="清空">✕</button>
      </div>
    </div>
    <div class="char-count" id="charCount">0 / 17</div>
    <div class="hint" id="hint"></div>
    <div class="divider"></div>

```
<div class="result-area" id="resultArea">
  <div class="label">计算结果</div>
  <div class="result-grid">
    <div class="result-box">
      <div class="result-label">第18位校验码</div>
      <div class="check-digit" id="checkDigit">-</div>
    </div>
    <div class="result-box">
      <div class="result-label">完整身份证号</div>
      <div class="full-id" id="fullId">-</div>
    </div>
  </div>
  <button class="copy-btn" id="copyBtn" onclick="copyResult()">
    📋  复制完整号码
  </button>
</div>
```

  </div>
</div>

<script>
const WEIGHTS = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
const CHECK_MAP = ['1','0','X','9','8','7','6','5','4','3','2'];

const input = document.getElementById('idInput');
const charCount = document.getElementById('charCount');
const hint = document.getElementById('hint');
const resultArea = document.getElementById('resultArea');
const checkDigitEl = document.getElementById('checkDigit');
const fullIdEl = document.getElementById('fullId');
const clearBtn = document.getElementById('clearBtn');
const copyBtn = document.getElementById('copyBtn');

let fullNumber = '';

input.addEventListener('input', () => {
  // Strip non-digits
  let val = input.value.replace(/\D/g, '');
  if (val.length > 17) val = val.slice(0, 17);
  input.value = val;

  const len = val.length;
  charCount.textContent = `${len} / 17`;
  charCount.className = 'char-count' + (len === 17 ? ' full' : len > 17 ? ' over' : '');

  clearBtn.classList.toggle('show', len > 0);
  input.classList.remove('error');
  hint.classList.remove('show');
  hint.textContent = '';

  if (len === 17) {
    compute(val);
  } else {
    resultArea.classList.remove('visible');
  }
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  input.dispatchEvent(new Event('input'));
  input.focus();
});

function compute(digits) {
  let sum = 0;
  for (let i = 0; i < 17; i++) {
    sum += parseInt(digits[i]) * WEIGHTS[i];
  }
  const remainder = sum % 11;
  const code = CHECK_MAP[remainder];
  fullNumber = digits + code;

  checkDigitEl.textContent = code;
  fullIdEl.innerHTML = digits + '<span class="highlight">' + code + '</span>';
  resultArea.classList.add('visible');
}

function copyResult() {
  if (!fullNumber) return;
  navigator.clipboard.writeText(fullNumber).then(() => {
    copyBtn.classList.add('copied');
    copyBtn.textContent = '✓  已复制到剪贴板';
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = '📋  复制完整号码';
    }, 1800);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = fullNumber;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyBtn.classList.add('copied');
    copyBtn.textContent = '✓  已复制';
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = '📋  复制完整号码';
    }, 1800);
  });
}

// Auto-focus
input.focus();
</script>

</body>
</html>
